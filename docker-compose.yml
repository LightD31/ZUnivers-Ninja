# ZUnivers Ninja : interface web + conseils automatiques sur Discord.
#   1. Copie .env.example en .env et renseigne au moins ZU_USERS.
#   2. docker compose up -d
#   3. Ouvre http://localhost:8080
services:
  zunivers-ninja:
    image: ghcr.io/alexpresso/zunivers-ninja:latest
    build: .
    container_name: zunivers-ninja
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Paris}
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - ./data:/data
