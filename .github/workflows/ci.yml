name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @zuninja/web build:standalone

  docker:
    name: Docker image
    # Seulement sur les PR : leur CI construit déjà l'arbre fusionné avec main, et la publication
    # (workflow Release, sur un tag) reconstruit l'image. Sur main, ce serait un second build inutile.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zunivers-ninja:ci
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name ninja -p 8080:8080 zunivers-ninja:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health | grep -q '"version":"0.0.0-ci"'
          curl -sf http://localhost:8080/ | grep -q 'ZUnivers Ninja'
          docker exec ninja test -f /app/planner-thread.js
          docker rm -f ninja
