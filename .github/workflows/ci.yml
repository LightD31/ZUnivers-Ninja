name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @zuninja/web build:standalone

  docker:
    name: Docker image
    # Seulement sur les PR : sur main, le job `publish` construit l'image (une seule fois).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: zunivers-ninja:ci
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name ninja -p 8080:8080 zunivers-ninja:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/health | grep -q '"version":"0.0.0-ci"'
          curl -sf http://localhost:8080/ | grep -q 'ZUnivers Ninja'
          docker exec ninja test -f /app/planner-thread.js
          docker rm -f ninja

  # Chaque push sur main publie l'image, une fois les vérifications passées.
  publish:
    name: Publish Docker image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Deux fusions rapprochées : seule la plus récente va jusqu'au bout.
    concurrency:
      group: publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version affichée par /health : le commit publié.
          build-args: APP_VERSION=${{ steps.version.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
